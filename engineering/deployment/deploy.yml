# yaml-language-server: $schema=../../../../../conventions/deployment/descriptor/deploy.schema.json
# What the Events domain deploys: one service hosting the Form 1 module, its HTTP API, the SCFD pull consumer and the
# review console. Format and rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md. Hostnames,
# secrets and environments live in Wheelhouse targets, never here. Paths are relative to engineering/.
descriptor: 2
product: events
name: Events
description: Internal event catalog fed by SCFD and curated in review, with private tracking per organization.
homepage: https://github.com/wow-two-sdk-beta/wow-two-sdk-beta.events
platform: linux/amd64
# Dev runs as .NET Development, prod as Production; appsettings.Development.json holds defaults only, and an IDE
# run's own values live in appsettings.Local.json.
dotnetEnvironment: true
# The dev check: once a dev rollout succeeds, the service's own image asks it for its health and its status over the
# platform network. A pass lets auto-promote take the release. Each request carries the probe Host (localhost): a
# target's AllowedHosts names its public hosts plus localhost, so the service's platform-network name in the URL
# would answer 400 from host filtering.
verify:
  service: events
  command:
    - sh
    - -c
    - >-
      curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_EVENTS/health"
      && curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_EVENTS/api/system/status"
      && echo "health and status answered"
  timeout: 1m
# One host role: the front door for the API and the review console, which signs reviewers in through Identity's BFF
# (events-integration #30); a private console site would need a tailnet node, so the console shares `app`.
sites:
  app: { primary: true }
shared:
  - codebase/events.backend-services/Directory.*.props
  - codebase/events.backend-services/global.json
services:
  events:
    build:
      dockerfile: deployment/Dockerfile
    paths:
      - codebase/events.backend-services/**
      - codebase/events.frontend-services/**
    health: /health
    memory: 256m
    # Typed keys: Wheelhouse checks each saved value against its type; a required key joins settings.required. The
    # connection string comes from the target's PostgreSQL (needs: [postgres]) and, ending in ConnectionString, stays
    # in its vault.
    # Tokens (events-integration #21, #23): P1 trusts one issuer, Ocharo's Identity; Events' resource `Uri` there is the
    # `app` site URL with its slash, the same string as the audience. Identity's revocation signals arrive at
    # {Uri}signals/identity, the resource's SignalUrl.
    # Console (#30): confidential client `events-console` at the same issuer; Identity registers
    # {site}/api/identity/callback, {site}/ and {site}/api/identity/signal for it.
    # Intake (#15): source 0 pulls SCFD's subscription for catalog `ocharo-fashion` with client `events` and scope
    # `harvest.events-read`; with no BaseUrl or SubscriptionId the source stays off and nothing is pulled.
    settings:
      keys:
        DatabaseSettings:ConnectionString: { required: true }
        Events:Auth:Audience: { type: url, required: true }
        Events:Auth:Issuers:0:Issuer: { type: url, required: true }
        Events:Auth:Issuers:0:Audiences:0: { type: url, required: true }
        Events:Console:Authority: { type: url }
        Events:Console:ClientId: { default: events-console }
        Events:Console:ClientSecret: { secret: true }
        Events:Intake:Sources:0:Name: { default: afisha }
        Events:Intake:Sources:0:Catalog: { default: ocharo-fashion }
        Events:Intake:Sources:0:Instance: { default: scfd }
        Events:Intake:Sources:0:BaseUrl: { type: url }
        Events:Intake:Sources:0:SubscriptionId: {}
        Events:Intake:Sources:0:TokenEndpoint: { type: url }
        Events:Intake:Sources:0:ClientId: { default: events }
        Events:Intake:Sources:0:ClientSecret: { secret: true }
        Events:Intake:Sources:0:Scope: { default: harvest.events-read }
        Events:Intake:Sources:0:PollInterval: { default: "00:05:00" }
    needs: [postgres]
    # The pages and the signal route at /, the contract's HTTP mirror and the BFF under the same host's /api.
    sites:
      app: { paths: [/, /api] }
# The migrate step (pipelines v0.12.0): on every forward deploy, after the pull and before any service restarts, the
# release image runs its own `migrate` (apply, then seed) against the target's database; the build records the sets it
# hosts from `migrate sets --json`. One item per image that hosts a set.
migrate:
  - service: events
    command: [dotnet, Events.Api.dll, migrate]
