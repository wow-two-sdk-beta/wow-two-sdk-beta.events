# Local verification only. Bring up from engineering/deployment/:
#
#   docker compose up -d --build     the whole stack; the service answers on http://127.0.0.1:8411
#   docker compose up -d database    only the database, for an IDE run of Events.Api (loopback 8414)
#
# The image boots as Production, which only verifies the migration levels, so events-migrate applies the module's set
# first with the image's own migrate command, as a deploy's migrate step does, and the service waits for it to finish
# (M47). The credentials are local-only test values; a deployed environment's connection string comes from its
# Wheelhouse target, which fills it from the target's own database.
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    ports:
      - "127.0.0.1:8414:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 5s
      timeout: 3s
      retries: 20

  events-migrate:
    image: events:local
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    init: true
    command: ["migrate"]
    environment:
      DB_CONNECTION: "Host=database;Database=events;Username=events;Password=events"
    depends_on:
      database:
        condition: service_healthy

  events:
    image: events:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8411:8080"
    environment:
      DB_CONNECTION: "Host=database;Database=events;Username=events;Password=events"
    depends_on:
      events-migrate:
        condition: service_completed_successfully
    mem_limit: 256m

volumes:
  database:
